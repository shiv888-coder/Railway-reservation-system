# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# ------------------------------------------------------------------------------
# MySQL 8 Database Configuration
# Uses environment variables with sensible local development defaults.
# Set DB_URL, DB_USERNAME, and DB_PASSWORD in your environment or IDE.
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/railway_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------------------------------------------
# Spring Data JPA & Hibernate Configuration
# ddl-auto: 'none' or 'validate' for production; 'update' for development
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Cross-Origin Resource Sharing (CORS) Configuration
# Allows communication from the React + TypeScript frontend
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173,https://ais-dev-5ssd44xzjuszhnfuvfmtr7-834753063931.asia-northeast1.run.app}

