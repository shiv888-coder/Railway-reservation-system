# Server Configuration
server.port=8085
spring.application.name=railway-reservation-system

# Externalized Database Configuration
# Supports local file (railway.db), custom path, or hosted volume via RAILWAY_DB_PATH env var
railway.db.path=${RAILWAY_DB_PATH:railway.db}

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.railway.reservation=INFO
