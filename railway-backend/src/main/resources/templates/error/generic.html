<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Error — Indian Railway Reservation System</title>
</head>
<body>
<section>

    <div style="max-width: 580px; margin: 3rem auto; text-align: center;">
        <div class="ir-card" style="padding: 2.5rem 1.5rem; border-top: 4px solid var(--ir-crimson);">
            <div style="font-size: 3rem; margin-bottom: 0.75rem;">⚠️</div>
            <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--ir-navy); margin-bottom: 0.5rem;">Operation Failed</h2>
            <div th:if="${exceptionType}" style="font-size: 0.85rem; color: #991b1b; font-family: monospace; margin-bottom: 0.75rem;" th:text="${exceptionType}">
                InvalidJourneyException
            </div>
            <p style="color: var(--ir-text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;" th:text="${errorMessage}">
                An error occurred while processing your request. Please check input parameters and try again.
            </p>
            <div style="display: flex; justify-content: center; gap: 0.75rem;">
                <a href="javascript:history.back()" class="ir-btn ir-btn-outline">
                    &larr; Go Back
                </a>
                <a th:href="@{/dashboard}" class="ir-btn ir-btn-primary">
                    Return to Dashboard
                </a>
            </div>
        </div>
    </div>

</section>
</body>
</html>
